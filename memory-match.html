<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible Memory Match</title>
<style>
  :root { color-scheme: light }
  body { margin:0; background:#0f5132; color:#eaf5ee; min-height:100vh;
         font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:28px 16px }
  h1 { font-size:17px; margin:0 0 4px; font-weight:650 }
  p.sub { margin:0 0 18px; opacity:.75; font-size:13px }
  canvas { border-radius:10px; cursor:pointer; box-shadow:0 8px 28px rgba(0,0,0,.35) }
  /* We draw our own per-card focus ring in drawFocusRing() — the browser's
     default rectangle-around-the-whole-canvas outline would be misleading
     since it can't show which card is focused. */
  canvas:focus { outline:none }
  .stats { margin-top:16px; font-size:15px; font-weight:600; text-align:center }
  .restart-btn {
    margin-top:14px; padding:10px 22px; min-height:44px; /* WCAG 2.5.5 touch-target minimum */
    font:600 14px inherit; border:none; border-radius:8px;
    background:#1c4f8f; color:#eaf5ee; cursor:pointer;
  }
  .restart-btn:hover { background:#2a63ad }
  .restart-btn:focus-visible { outline:3px solid #ffd45e; outline-offset:2px }
  .readout { margin-top:10px; font-size:12.5px; opacity:.8;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:center }
  .readout b { color:#ffd45e }

  /* Standard "visually hidden but still in the accessibility tree" pattern.
     display:none or visibility:hidden would remove this from screen reader
     output entirely -- this keeps it readable while invisible on screen. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <h1>Memory Match</h1>
  <p class="sub">Click a card to flip it, or tab to the grid and use arrow keys + Enter. Resize the window — the grid stays sharp and reflows.</p>
  <canvas id="table" tabindex="0"
    aria-label="Memory match game. Use arrow keys to move between cards, Enter or Space to flip the focused card."></canvas>
  <div class="stats" id="stats">Moves: 0</div>
  <button id="restart" class="restart-btn">New Game</button>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div class="readout" id="readout"></div>

<script>
/* ============================================================================
   Accessible Memory Match — built on canvas-demo.html for the Microsoft
   Casual Games interview (Wed 8/5). canvas-demo.html stays as-is; this file
   grows the same four techniques into an actual game:
     1. devicePixelRatio scaling  — why Canvas is blurry on Retina until you fix it
     2. the requestAnimationFrame loop and why you use delta time, not frame counts
     3. the flip, which is a horizontal scale, not a real 3D rotation
     4. hit-testing, because Canvas has no DOM and therefore no event targets
   ========================================================================== */

const canvas = document.getElementById('table');
const ctx    = canvas.getContext('2d');
const readout= document.getElementById('readout');
const statsEl= document.getElementById('stats');
const liveEl = document.getElementById('live');
const restartBtn = document.getElementById('restart');

/* ---------------------------------------------------------------------------
   LAYOUT

   The grid is fixed at 4 columns × 3 rows (12 cards), but the SIZE of that
   grid is not fixed — it's derived from the available viewport width every
   time resize() runs. Card width/height and the resulting canvas CSS size
   are all computed here, then fed into the DPI step below unchanged.

   CSS_W / CSS_H used to be constants. They're now `let`, recomputed each
   resize — everything downstream that reads them (background fill, hit
   testing) still just reads two numbers and doesn't care that they move.
--------------------------------------------------------------------------- */
const GRID_COLS = 4, GRID_ROWS = 3, GAP = 14;
const CARD_RATIO = 120 / 168; // width/height — same card shape as the original
const MAX_GRID_W = 640;       // cap so cards don't get silly-large on desktop

const CARD = { w: 0, h: 0 }; // populated by computeLayout()
let CSS_W = 0, CSS_H = 0;

function computeLayout() {
  const available = Math.min(window.innerWidth - 32, MAX_GRID_W);
  CARD.w = (available - GAP * (GRID_COLS - 1)) / GRID_COLS;
  CARD.h = CARD.w / CARD_RATIO;
  CSS_W  = available;
  CSS_H  = GRID_ROWS * CARD.h + (GRID_ROWS - 1) * GAP;
}

/* A card's pixel position is derived from its row/col every time it's
   needed, rather than stored and kept in sync. One source of truth (the
   grid position) instead of two things (grid position + cached pixels)
   that could drift apart after a resize. */
function cardX(c) { return c.col * (CARD.w + GAP); }
function cardY(c) { return c.row * (CARD.h + GAP); }

/* ---------------------------------------------------------------------------
   1. DPI-AWARE SIZING  ← the single most useful thing in this file

   A canvas has two independent sizes:
     - its CSS size   (how big it appears on screen)
     - its buffer size (how many actual pixels it has to draw into)

   Set only the CSS size and the browser stretches a 640-pixel-wide buffer
   across a 1280-physical-pixel display. That's the blur. On a Retina screen
   devicePixelRatio is 2, so you allocate 2x the pixels, then scale the drawing
   context by the same factor so all your drawing code can keep using CSS units.

   This is the Canvas version of exactly the problem their JD calls
   "pixel-perfect across screen resolutions."
--------------------------------------------------------------------------- */
function resize() {
  computeLayout();                         // grid size can change too
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width  = CSS_W + 'px';      // how big it looks
  canvas.style.height = CSS_H + 'px';
  canvas.width  = Math.round(CSS_W * dpr); // how many pixels it actually has
  canvas.height = Math.round(CSS_H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // 1 unit of drawing = 1 CSS px again
  readout.innerHTML =
    `devicePixelRatio <b>${dpr}</b> · CSS <b>${Math.round(CSS_W)}×${Math.round(CSS_H)}</b> · buffer <b>${canvas.width}×${canvas.height}</b>`;
}
resize();
/* Dragging a window between a laptop screen and an external monitor changes
   devicePixelRatio mid-session. Most people never handle this. Same handler
   also covers a plain browser-width resize, which is now a layout change
   too since the grid is responsive. */
window.addEventListener('resize', resize);
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
  .addEventListener('change', resize, { once: false });

/* ---------------------------------------------------------------------------
   2. STATE
   Each card owns a flip progress value from 0 (face down) to 1 (face up).
   Animation = moving that number over time. Rendering = a pure function of it.
   Keeping those two separate is what keeps animation code sane.
--------------------------------------------------------------------------- */
const PAIRS = [
  { rank:'A', suit:'♠', red:false },
  { rank:'K', suit:'♥', red:true  },
  { rank:'Q', suit:'♦', red:true  },
  { rank:'J', suit:'♣', red:false },
  { rank:'7', suit:'♥', red:true  },
  { rank:'3', suit:'♠', red:false },
];

// Screen readers can't be expected to make sense of "K♥" -- spell it out.
const RANK_NAMES = { A:'Ace', K:'King', Q:'Queen', J:'Jack' };
const SUIT_NAMES = { '♠':'Spades', '♥':'Hearts', '♦':'Diamonds', '♣':'Clubs' };
function cardLabel(c) {
  return `${RANK_NAMES[c.rank] || c.rank} of ${SUIT_NAMES[c.suit]}`;
}

function announce(msg) { liveEl.textContent = msg; }

function shuffle(arr) {
  // Fisher-Yates. Walk backwards, swap each slot with a random earlier one.
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Two copies of each face, tagged with a shared pairId so matching two
// cards later is just "do these two cards have the same pairId" — no
// comparing rank+suit strings.
const deck = shuffle(PAIRS.flatMap((face, pairId) => [
  { ...face, pairId },
  { ...face, pairId },
]));

const cards = deck.map((face, i) => ({
  ...face,
  col: i % GRID_COLS,
  row: Math.floor(i / GRID_COLS),
  progress: 0,   // current flip position, 0..1
  target:   0,   // where it's heading
  matched:  false, // true once this card is permanently resolved
}));

const FLIP_MS = 320;      // duration of a full flip
const MISMATCH_MS = 700;  // how long a non-matching pair stays visible before flipping back
                           // (longer than FLIP_MS — the player needs time to actually read it,
                           // not just watch it finish animating)

/* ---------------------------------------------------------------------------
   MATCH-CHECKING STATE MACHINE

   faceUp holds the 0-2 cards currently flipped but not yet resolved.
   locked is true only while a mismatched pair is being shown, so a third
   card can't be flipped mid-reveal. It does NOT block a second click while
   the first card is still animating — that's normal, legal play.
--------------------------------------------------------------------------- */
let faceUp = [];
let locked = false;
let moves = 0;   // one "move" = one two-card attempt, win or lose
let won = false;
let mismatchTimer = null;   // pending flip-back timeout, tracked so restart can cancel it

/* ---------------------------------------------------------------------------
   KEYBOARD FOCUS

   Canvas has no per-element DOM focus, so "which card is focused" has to be
   tracked ourselves as an index into `cards`, the same way `col`/`row` stand
   in for real DOM position elsewhere in this file. canvasFocused tracks
   whether the canvas itself currently has real DOM focus, so the ring only
   draws for keyboard users (mirrors :focus-visible on native controls).
--------------------------------------------------------------------------- */
let focusIndex = 0;
let canvasFocused = false;
// :focus-visible is the browser's own "was this focus from a keyboard?"
// heuristic (true for Tab, false for a mouse/touch click on an element
// like this) -- asking it directly beats re-implementing that judgment call.
canvas.addEventListener('focus', () => { canvasFocused = canvas.matches(':focus-visible'); });
canvas.addEventListener('blur',  () => { canvasFocused = false; });

canvas.addEventListener('keydown', e => {
  const step = { ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1] }[e.key];
  const isActivate = e.key === 'Enter' || e.key === ' ';
  if (!step && !isActivate) return;   // not a key we handle

  e.preventDefault();                 // stop arrows/Space from scrolling the page,
                                       // even if the lock check below ends up ignoring it
  if (locked) return;                 // same rule as clicking: input suspended during a reveal

  if (step) {
    const cur = cards[focusIndex];
    const col = Math.min(Math.max(cur.col + step[0], 0), GRID_COLS - 1);
    const row = Math.min(Math.max(cur.row + step[1], 0), GRID_ROWS - 1);
    // (col, row) -> index is the reverse of how `cards` was built, so no search needed
    focusIndex = row * GRID_COLS + col;
  } else {
    const c = cards[focusIndex];
    if (!c.matched && c.target === 0) flipUp(c);
  }
});

function updateStats() {
  statsEl.textContent = won
    ? `Moves: ${moves} — all 6 pairs matched!`
    : `Moves: ${moves}`;
}
updateStats();

function flipUp(c) {
  c.target = 1;
  faceUp.push(c);

  if (faceUp.length < 2) {
    announce(cardLabel(c));   // first card of the attempt: just say what it is
    return;
  }

  moves++;   // the pair is complete regardless of outcome, so count it here
  locked = true;
  const [a, b] = faceUp;
  if (a.pairId === b.pairId) {
    a.matched = b.matched = true;
    faceUp = [];
    locked = false;
    // Once every card is matched, the click handler's own `!c.matched`
    // check already refuses every future click — nothing extra needed
    // to "stop" the game.
    if (cards.every(card => card.matched)) {
      won = true;
      announce(`${cardLabel(b)}. Match! You've matched all 6 pairs in ${moves} moves.`);
    } else {
      announce(`${cardLabel(b)}. Match!`);
    }
  } else {
    // Bundle the second card's value + the result into ONE announcement,
    // rather than two back-to-back updates -- rapid-fire changes to a
    // live region can get coalesced or dropped by some screen readers.
    announce(`${cardLabel(b)}. No match, flipping back.`);
    mismatchTimer = setTimeout(() => {
      a.target = 0;
      b.target = 0;
      faceUp = [];
      locked = false;
      mismatchTimer = null;
    }, MISMATCH_MS);
  }
  updateStats();
}

/* ---------------------------------------------------------------------------
   RESTART

   Reuses shuffle() and mutates the existing card objects in place (rather
   than replacing `cards`) so col/row (grid position) stay put and only the
   faces move. Mutating in place also means a stale mismatch timeout from
   BEFORE the restart is harmless: it still points at the same objects, and
   setting their target back to 0 is a no-op once newGame() has already
   reset everything -- but clearing it explicitly avoids a rarer case where
   it could fire *after* the player has already flipped one of those same
   slots again in the new game.
--------------------------------------------------------------------------- */
function newGame() {
  if (mismatchTimer) { clearTimeout(mismatchTimer); mismatchTimer = null; }

  shuffle(deck);
  cards.forEach((c, i) => {
    Object.assign(c, deck[i], { progress: 0, target: 0, matched: false });
  });

  faceUp = [];
  locked = false;
  moves = 0;
  won = false;
  focusIndex = 0;

  updateStats();
  announce('New game. Board reshuffled.');
}

restartBtn.addEventListener('click', newGame);

/* Ease-in-out cubic. Linear motion reads as mechanical; easing reads as
   deliberate. This is most of the difference between "it moves" and "it feels
   good," which on a casual-games team is the whole job. */
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/* ---------------------------------------------------------------------------
   3. THE ANIMATION LOOP

   requestAnimationFrame hands you a timestamp. Use the DELTA between frames to
   advance animation, never a fixed increment per frame — otherwise everything
   runs at double speed on a 120Hz display and slows to a crawl when the tab is
   busy. Time-based, not frame-based.
--------------------------------------------------------------------------- */
let last = performance.now();

function frame(now) {
  const dt = Math.min(now - last, 50); // clamp: a backgrounded tab can hand you
  last = now;                          // a huge dt and teleport the animation

  for (const c of cards) {
    if (c.progress !== c.target) {
      const dir  = Math.sign(c.target - c.progress);
      const step = dt / FLIP_MS;
      c.progress += dir * step;
      // don't overshoot the target
      if (dir > 0) c.progress = Math.min(c.progress, c.target);
      else         c.progress = Math.max(c.progress, c.target);
    }
  }

  draw();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------------------
   4. DRAWING

   Canvas is immediate-mode: nothing persists, so every frame repaints from
   scratch. That's the opposite of the DOM's retained model, and it's the
   mental shift worth naming out loud if Bryan asks about DOM vs Canvas.
--------------------------------------------------------------------------- */
function draw() {
  ctx.clearRect(0, 0, CSS_W, CSS_H);

  // felt background
  ctx.fillStyle = '#0b7a45';
  roundRect(0, 0, CSS_W, CSS_H, 10);
  ctx.fill();

  for (const c of cards) drawCard(c);

  if (canvasFocused) drawFocusRing(cards[focusIndex]);
}

function drawFocusRing(c) {
  // Drawn un-transformed, straight from cardX/cardY — the card's bounding
  // box stays a fixed rectangle through the whole flip; only its drawn
  // contents get squashed by drawCard()'s scale transform.
  ctx.save();
  ctx.strokeStyle = '#ffd45e';
  ctx.lineWidth = 3;
  roundRect(cardX(c) - 3, cardY(c) - 3, CARD.w + 6, CARD.h + 6, 11);
  ctx.stroke();
  ctx.restore();
}

function drawCard(c) {
  const p = ease(c.progress);

  /* THE FLIP: squash horizontally to zero width and back out again. Past the
     halfway point you swap which face you draw. It reads as a 3D rotation but
     it's a 2D scale — cheap, and indistinguishable at this speed. A real 3D
     flip needs WebGL or a CSS 3D transform on a DOM element. */
  const scaleX  = Math.abs(Math.cos(p * Math.PI));
  const showing = p < 0.5 ? 'back' : 'face';

  ctx.save();
  // move the origin to the card's centre so the squash happens around the
  // middle rather than the left edge
  ctx.translate(cardX(c) + CARD.w / 2, cardY(c) + CARD.h / 2);
  ctx.scale(Math.max(scaleX, 0.001), 1); // never exactly 0 — some browsers
                                          // throw away the whole draw call
  ctx.translate(-CARD.w / 2, -CARD.h / 2);

  // drop shadow, softened as the card turns edge-on
  ctx.shadowColor   = `rgba(0,0,0,${0.35 * scaleX})`;
  ctx.shadowBlur    = 14;
  ctx.shadowOffsetY = 5;

  if (showing === 'back') drawBack();
  else                    drawFace(c);

  ctx.restore();
}

function drawBack() {
  ctx.fillStyle = '#1c4f8f';
  roundRect(0, 0, CARD.w, CARD.h, 9);
  ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1.5;
  roundRect(7, 7, CARD.w - 14, CARD.h - 14, 6);
  ctx.stroke();

  // simple cross-hatch pattern
  ctx.save();
  ctx.beginPath(); ctx.rect(7, 7, CARD.w - 14, CARD.h - 14); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  ctx.lineWidth = 1;
  for (let i = -CARD.h; i < CARD.w + CARD.h; i += 11) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + CARD.h, CARD.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i, CARD.h); ctx.lineTo(i + CARD.h, 0); ctx.stroke();
  }
  ctx.restore();
}

function drawFace(c) {
  ctx.fillStyle = '#fdfdfb';
  roundRect(0, 0, CARD.w, CARD.h, 9);
  ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.strokeStyle = 'rgba(0,0,0,.16)';
  ctx.lineWidth = 1;
  roundRect(0.5, 0.5, CARD.w - 1, CARD.h - 1, 9);
  ctx.stroke();

  ctx.fillStyle = c.red ? '#c0202f' : '#16181c';

  // corner index, top-left
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '600 21px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(c.rank, 11, 10);
  ctx.font = '17px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(c.suit, 11, 33);

  // centre pip
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '54px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(c.suit, CARD.w / 2, CARD.h / 2);

  // corner index again, bottom-right, rotated 180°
  ctx.save();
  ctx.translate(CARD.w - 11, CARD.h - 10);
  ctx.rotate(Math.PI);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '600 21px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(c.rank, 0, 0);
  ctx.font = '17px ui-sans-serif, system-ui, sans-serif';
  ctx.fillText(c.suit, 0, 23);
  ctx.restore();
}

/* Rounded rectangle. Older Safari lacks ctx.roundRect(), so this is the
   portable version — a small, real example of the cross-browser work their
   JD is asking about. */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* ---------------------------------------------------------------------------
   5. HIT-TESTING

   Canvas draws pixels. It has no elements, so there is nothing to attach a
   click handler to and no event.target to inspect. You take the pointer
   position, convert it from viewport coordinates into canvas coordinates, and
   work out yourself what's underneath it.

   This is THE structural difference from DOM work, and a good thing to be able
   to articulate.
--------------------------------------------------------------------------- */
canvas.addEventListener('click', e => {
  if (locked) return;                // a mismatched pair is still being shown

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;   // getBoundingClientRect keeps this correct
  const y = e.clientY - rect.top;    // even if the canvas is scaled by CSS

  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const cx = cardX(c), cy = cardY(c);
    if (x >= cx && x <= cx + CARD.w && y >= cy && y <= cy + CARD.h) {
      focusIndex = i;   // clicking also moves keyboard focus, so the two stay in sync
      // ignore clicks on a card that's already resolved or already face-up
      if (!c.matched && c.target === 0) flipUp(c);
      break;                                // topmost hit wins
    }
  }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
